# A unique identifier for the head node and workers of this cluster.
cluster_name: slurm-cluster

# The maximum number of workers nodes to launch in addition to the head
# node.
min_workers: 0
max_workers: 3

# The autoscaler will scale up the cluster faster with higher upscaling speed.
# E.g., if the task requires adding more nodes then autoscaler will gradually
# scale up the cluster in chunks of upscaling_speed*currently_running_nodes.
# This number should be > 0.
upscaling_speed: 1.0

# If a node is idle for this many minutes, it will be removed.
idle_timeout_minutes: 1

auth:
    ssh_user: ec2-user # Use for aws nodes

provider:
  type: external
  module: ray.autoscaler._private.slurm.hybrid_node_provider.HybridNodeProvider

  slurm:
    temp_folder_name: [_DEPLOY_RAY_PATH_]/autoscaler/slurm/temp_script/ # Need to be absolute path
    template_path: [_DEPLOY_RAY_TEMPLATE_PATH_] # Need to be absolute path
    gcs_port: "6379"
    ray_client_port: "10001"
    dashboad_port : "8265"

  aws:
    region: us-east-2
    availability_zone: us-east-2a
    cache_stopped_nodes: False
    use_internal_ips: False # by default autoscaler tries to connect to ec2 nodes using internal ip

# Specify the type for the ray head node (as configured below).
head_node_type: head

# Specify the allowed pod types for this ray cluster and the resources they provide.
available_node_types:
  head:
    max_workers: 0 # do not modify
    resources: {"CPU": [_DEPLOY_HEAD_CPUS_], "GPU": [_DEPLOY_HEAD_GPUS_]} # will be used by autoscaler scheduler
    node_config:
      provider: slurm
      head_node: 1 # needed by my create node. Do not modify 
      # under_slurm: 1

      # init_commands:
      #   - conda activate ray_env # TODO:

      # additional_slurm_commands: 
      #   - "#SBATCH --account=bcbb-delta-cpu"
      #   - "#SBATCH --partition=cpu"
  
  slurm_worker:
    min_workers: 0
    max_workers: 0
    resources: {"CPU": [_DEPLOY_WORKER_CPUS_], "GPU": [_DEPLOY_WORKER_GPUS_]}
    node_config:
      provider: slurm
      head_node: 0 # needed by my create node. Do not modify 
      under_slurm: 1 # doesn't matter. Worker node has to under slurm
      init_commands:
        - conda activate ray_env # TODO:
      additional_slurm_commands: 
        - "#SBATCH --account=bcbb-delta-cpu"
        - "#SBATCH --partition=cpu"

  aws_worker:
    min_workers: 0
    max_workers: 3
    resources: {"CPU": 2, "GPU": 0}
    node_config:
      provider: aws
      # Standard Ray AWS node config fields:
      InstanceType: t3.small
      ImageId: ami-0f4e4cb87f22c68bc # amazon-linux-python3.9.23-ray2.49.1-v2 (python3.9.23, ray2.49.1, matplotlib 3.9.4, numpy 2.0.2, ssh tunneling enabled)
      InstanceMarketOptions:
        MarketType: spot

# Do not modify the fields below!

# Empty setup commands for cluster launcher's checking
initialization_commands: []
setup_commands: []
head_setup_commands: []
worker_setup_commands: []
file_mounts: {}
cluster_synced_files: []

# Should be empty for Slurm provider. Fill the commands in node types instead
head_start_ray_commands: []

# Should be empty for Slurm provider. Fill the commands in node types instead
worker_start_ray_commands: []
