  #     machineType: e2-small
  #     disks:
  #       - boot: true
  #         autoDelete: true
  #         type: PERSISTENT
  #         initializeParams:
  #           sourceImage: projects/test-project-365620/global/images/python3923-ray2491
  #     scheduling:
  #       - provisioningModel: SPOT

# Do not modify the fields below!

# Empty setup commands for cluster launcher's checking
initialization_commands: []
setup_commands: []
head_setup_commands: []
worker_setup_commands: []
file_mounts: {}
cluster_synced_files: []

# Should be empty for Slurm provider. Fill the commands in node types instead
head_start_ray_commands: []

# Should be empty for Slurm provider. Fill the commands in node types instead
worker_start_ray_commands: []
